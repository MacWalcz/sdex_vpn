[package]
name = "sdex-vpn"
version = "0.1.0"
edition = "2021"

[dependencies]
blake3 = "1.5"
tun-rs = "2"
clap = { version = "4", features = ["derive"] }
rtnetlink = "0.18"
ipnetwork = "0.20"      # do parsowania CIDR
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
futures-util = "0.3"